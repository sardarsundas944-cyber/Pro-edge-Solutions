<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Student data cleaning pipeline output</title>
  <desc id="desc">Terminal output showing before and after data cleaning summaries and successful validation.</desc>
  <rect width="1200" height="720" fill="#101820"/>
  <rect width="1200" height="44" fill="#1d2b36"/>
  <circle cx="24" cy="22" r="7" fill="#ff6b5e"/>
  <circle cx="48" cy="22" r="7" fill="#f5c451"/>
  <circle cx="72" cy="22" r="7" fill="#53c98b"/>
  <text x="105" y="28" fill="#b6c5cc" font-family="Consolas, monospace" font-size="16">Python - clean_students.py</text>
  <g fill="#d7e3e8" font-family="Consolas, monospace" font-size="18">
    <text x="34" y="82" fill="#7fd1ae">PS&gt; python clean_students.py</text>
    <text x="34" y="122" fill="#f5c451">==============================================================</text>
    <text x="34" y="150" fill="#f5c451">BEFORE CLEANING</text>
    <text x="34" y="190">Rows: 13 | Columns: 7</text>
    <text x="34" y="220">Missing values: 3 | Duplicate rows: 1</text>
    <text x="34" y="250">age         string</text>
    <text x="34" y="278">attendance  string</text>
    <text x="34" y="326" fill="#f5c451">==============================================================</text>
    <text x="34" y="354" fill="#f5c451">AFTER CLEANING</text>
    <text x="34" y="394">Rows: 12 | Columns: 7</text>
    <text x="34" y="424">Missing values: 0 | Duplicate rows: 0</text>
    <text x="34" y="454">age         int64</text>
    <text x="34" y="482">attendance  int64</text>
    <text x="34" y="530" fill="#f5c451">CLEANING REPORT</text>
    <text x="34" y="562">Issues found: 17</text>
    <text x="34" y="590">Issues resolved: 17</text>
    <text x="34" y="626" fill="#7fd1ae">Validation passed: True</text>
    <text x="34" y="662" fill="#9fb2bc">Saved cleaned data and cleaning report.</text>
  </g>
</svg>
